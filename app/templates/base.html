<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}FruitPriceOptimizer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
<header>
  <a class="brand" href="/">FruitPriceOptimizer</a>
  {% if user %}
  <nav>
    <a href="/">대시보드</a>
    {% if user.role == 'admin' %}<a href="/sites">사이트·자격증명</a><a href="/users">사용자</a>{% endif %}
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="link">로그아웃</button></form>
  </nav>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
