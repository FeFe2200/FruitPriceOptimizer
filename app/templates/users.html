{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>사용자 관리</h1><p class="muted">viewer는 가격·작업만 볼 수 있고 사이트 자격증명 화면에 접근할 수 없습니다.</p></div></div><section class="grid two"><div class="card"><h2>사용자 추가</h2><form method="post" action="/users" class="stack"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>아이디<input name="username" required></label><label>비밀번호<input name="password" type="password" minlength="12" required></label><label>역할<select name="role"><option value="viewer">viewer</option><option value="admin">admin</option></select></label><button>추가</button></form></div><div class="card"><h2>사용자</h2><ul class="clean">{% for item in users %}<li><strong>{{ item.username }}</strong><span class="tag">{{ item.role }}</span></li>{% endfor %}</ul></div></section>{% endblock %}
