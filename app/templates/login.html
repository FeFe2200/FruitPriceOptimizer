{% extends 'base.html' %}
{% block title %}로그인 · FruitPriceOptimizer{% endblock %}
{% block content %}
<section class="auth card">
  <h1>관리 화면 로그인</h1>
  <p class="muted">사이트 자격증명은 관리자만 등록하고 열람할 수 있습니다.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>아이디<input name="username" required autocomplete="username"></label>
    <label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label>
    <button>로그인</button>
  </form>
</section>
{% endblock %}
