[project]
name = "fruit-price-optimizer"
version = "0.1.0"
description = "Scheduled product price comparison with secure site credentials"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0",
  "alembic==1.16.5",
  "jinja2==3.1.6",
  "python-multipart==0.0.20",
  "itsdangerous==2.2.0",
  "argon2-cffi==25.1.0",
  "cryptography==45.0.7",
  "playwright==1.55.0",
  "httpx==0.28.1",
  "beautifulsoup4==4.13.5",
  "croniter==6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]
